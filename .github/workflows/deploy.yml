name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Publishing waits until every chapter has passed its fact review.
    # Set the repository variable DEPLOY_PAGES to "true" to turn deployment on.
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # withastro/action does not read .nvmrc and falls back to its own default Node.js.
      # Read .nvmrc so deployments build with the same Node.js as CI, and fail if it is empty.
      - name: Read the Node.js version from .nvmrc
        id: node
        run: |
          version="$(tr -d '[:space:]' < .nvmrc)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install, build, and upload the site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
        with:
          node-version: ${{ steps.node.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
